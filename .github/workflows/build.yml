name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o Daily_Routine_GitHub_APK_Project.zip -d project
          cd project
          chmod +x gradlew
          
          # تعديل jvmTarget في كل ملفات Gradle
          find . -name "*.gradle" -o -name "*.gradle.kts" | while read f; do
            sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*['\''"]1\.8['\''"]/jvmTarget = '\''17'\''/g' "$f"
            sed -i 's/sourceCompatibility[[:space:]]*=[[:space:]]*['\''"]1\.8['\''"]/sourceCompatibility = JavaVersion.VERSION_17/g' "$f"
            sed -i 's/targetCompatibility[[:space:]]*=[[:space:]]*['\''"]1\.8['\''"]/targetCompatibility = JavaVersion.VERSION_17/g' "$f"
          done
          
          # إضافة إعدادات JVM Toolchain في build.gradle الرئيسي
          echo "" >> build.gradle
          echo "subprojects {" >> build.gradle
          echo "    afterEvaluate { project ->" >> build.gradle
          echo "        if (project.hasProperty(\"android\")) {" >> build.gradle
          echo "            android {" >> build.gradle
          echo "                compileOptions {" >> build.gradle
          echo "                    sourceCompatibility JavaVersion.VERSION_17" >> build.gradle
          echo "                    targetCompatibility JavaVersion.VERSION_17" >> build.gradle
          echo "                }" >> build.gradle
          echo "                kotlinOptions {" >> build.gradle
          echo "                    jvmTarget = \"17\"" >> build.gradle
          echo "                }" >> build.gradle
          echo "            }" >> build.gradle
          echo "        }" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle
          
          # إضافة إعداد في gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyRoutine-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
