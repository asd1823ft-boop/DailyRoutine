name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o Daily_Routine_GitHub_APK_Project.zip -d project
          cd project
          chmod +x gradlew

          cat > fix.gradle <<'EOF'
          import org.gradle.api.JavaVersion
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects { project ->
              project.tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              project.tasks.configureEach { task ->
                  if (task.name.contains("KotlinCompile") && task.hasProperty("kotlinOptions")) {
                      task.kotlinOptions.jvmTarget = "17"
                  }
              }
          }
          EOF

          ./gradlew -I fix.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyRoutine-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
