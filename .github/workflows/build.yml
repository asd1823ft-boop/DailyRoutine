name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o Daily_Routine_GitHub_APK_Project.zip -d project
          cd project
          chmod +x gradlew
          
          # تعديل ملفات Gradle
          for f in $(find . -name "*.gradle" -o -name "*.gradle.kts"); do
            sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*['\''"]1\.8['\''"]/jvmTarget = '\''17'\''/g' "$f"
            sed -i 's/sourceCompatibility[[:space:]]*=[[:space:]]*['\''"]1\.8['\''"]/sourceCompatibility = JavaVersion.VERSION_17/g' "$f"
            sed -i 's/targetCompatibility[[:space:]]*=[[:space:]]*['\''"]1\.8['\''"]/targetCompatibility = JavaVersion.VERSION_17/g' "$f"
          done
          
          # إضافة إعدادات في app/build.gradle
          cat >> app/build.gradle << 'EOF'
          
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          
          # إضافة إعداد في gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyRoutine-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
