name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o Daily_Routine_GitHub_APK_Project.zip -d project
          cd project
          chmod +x gradlew
          
          # استخراج الـ package name من ملفات المشروع
          PACKAGE=$(find app/src/main/java -name "*.kt" -o -name "*.java" | head -1 | sed 's|app/src/main/java/||' | sed 's|/.*||' | tr '/' '.')
          
          if [ -z "$PACKAGE" ]; then
            PACKAGE="com.example.dailyroutine"
          fi
          
          echo "Using package: $PACKAGE"
          
          # حذف الملفات القديمة
          rm -f settings.gradle.kts
          rm -f app/build.gradle.kts
          
          # إنشاء settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DailyRoutine"
          include(":app")
          EOF
          
          # إنشاء app/build.gradle مع الـ package المستخرج
          cat > app/build.gradle << EOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "$PACKAGE"
              compileSdk = 34
          
              defaultConfig {
                  applicationId = "$PACKAGE"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
          }
          EOF
          
          # إنشاء gradle.properties
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          kotlin.jvm.target.validation.mode=warning
          EOF
          
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyRoutine-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
